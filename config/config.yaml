subinfo_fields:
  - name: subject_id
    type: int
    constraints: {min: 101, max: 999, digits: 3}
subinfo_mapping:
  subject_id: 被试编号（3位数字）
  Participant Information: 被试信息
  registration_failed: 登记失败
  registration_successful: 登记成功
  invalid_input: "{field} 输入无效"

window:
  size: [1280, 800]
  units: deg
  screen: 0
  bg_color: black
  fullscreen: false
  monitor_width_cm: 35.5
  monitor_distance_cm: 60

task:
  task_name: Lexical Decision Task
  save_path: ./outputs/human
  language: Chinese
  voice_name: zh-CN-YunyangNeural
  voice_enabled: false
  total_blocks: 4
  total_trials: 120
  trial_per_block: 30
  conditions: [high_frequency_word, low_frequency_word, pseudoword]
  block_counts:
    - {high_frequency_word: 8, low_frequency_word: 7, pseudoword: 15}
    - {high_frequency_word: 7, low_frequency_word: 8, pseudoword: 15}
    - {high_frequency_word: 8, low_frequency_word: 7, pseudoword: 15}
    - {high_frequency_word: 7, low_frequency_word: 8, pseudoword: 15}
  practice_trials: 30
  stimuli_file: assets/stimuli.csv
  display_case: upper
  word_key: f
  nonword_key: j
  key_list: [f, j]
  seed_mode: same_across_sub
  overall_seed: 42062
  plan_seed: 62062
  delta: 0.0
  phase_order: [instruction, practice_intro, fixation, lexical_decision, error_feedback, iti, block_summary, good_bye]

timing:
  fixation_duration: 0.5
  response_window: 2.0
  error_feedback_duration: 0.75
  iti_duration: 0.15

stimuli:
  instruction:
    type: text
    font: SimHei
    text: |-
      屏幕中央会依次出现大写英文字母串。

      如果字母串是英文单词，请按 F 键；
      如果不是英文单词，请按 J 键。

      请在保证准确的前提下尽快反应。错误反应后会出现“错误”提示。

      按空格键继续。
    color: white
    height: 0.8
    wrapWidth: 24
    pos: [0, 0]
  practice_intro: {type: text, font: SimHei, text: "先进行 30 次练习。F = 英文单词，J = 非英文单词。\n\n按空格键开始。", color: white, height: 0.85, wrapWidth: 22, pos: [0, 0]}
  fixation: {type: text, font: Arial, text: "+", color: white, height: 1.0, pos: [0, 0]}
  letter_string: {type: text, font: Courier New, text: "{letter_string}", color: white, height: 1.3, pos: [0, 0]}
  feedback_error: {type: text, font: SimHei, text: 错误, color: red, height: 1.2, pos: [0, 0]}
  blank: {type: text, font: Arial, text: "", color: black, height: 1.0, pos: [0, 0]}
  block_break: {type: text, font: SimHei, text: "第 {block_num}/{total_blocks} 组完成\n\n正确率：{accuracy}\n当前词频效应：{frequency_effect}\n\n请稍作休息，按空格键继续。", color: white, height: 0.8, wrapWidth: 22, pos: [0, 0]}
  good_bye: {type: text, font: SimHei, text: "任务完成\n\n总正确率：{accuracy}\n单词正确率：{word_accuracy}\n伪词正确率：{nonword_accuracy}\n词频效应（低频-高频）：{frequency_effect}\n超时：{timeouts}\n\n按空格键退出。", color: white, height: 0.8, wrapWidth: 24, pos: [0, 0]}

triggers:
  map:
    experiment_start: 1
    block_start: 10
    fixation: 20
    stimulus_high_frequency_word: 30
    stimulus_low_frequency_word: 31
    stimulus_pseudoword: 32
    stimulus_practice_word: 33
    stimulus_practice_nonword: 34
    word_response: 40
    nonword_response: 41
    response_timeout: 42
    error_feedback: 50
    iti: 60
    block_end: 90
    experiment_end: 99
  driver: {type: serial_url, url: "loop://", baudrate: 115200, timeout: 1}
  policy: {strict: false}
  timing: {post_delay_s: 0.001}
